# Sempre que a branch "trabalho" recebe um push, ela é mesclada (merge) na "develop".
# Se houver conflito, a execução falha e a develop não é alterada: resolva o conflito localmente
# (git checkout develop && git merge trabalho) e envie.
name: Sincronizar develop com trabalho

on:
  push:
    branches: [trabalho]

permissions:
  contents: write

concurrency:
  group: sincronizar-develop
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mesclar trabalho na develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout develop
          git merge --no-edit origin/trabalho
          git push origin develop
