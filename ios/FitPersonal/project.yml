# XcodeGen — gera FitPersonal.xcodeproj a partir deste arquivo.
#   brew install xcodegen
#   cd ios/FitPersonal && xcodegen generate && open FitPersonal.xcodeproj
#
# ATENÇÃO: este projeto foi escrito SEM Xcode no ambiente de desenvolvimento: não foi compilado.
# Veja ios/FitPersonal/README.md para a lista de verificações.
name: FitPersonal
options:
  bundleIdPrefix: br.com.fitpersonal
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pt-BR
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FitPersonal:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FitPersonal
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: false
        # Abrir arquivos .rjetreino / .rjetreinopack (WhatsApp, e-mail, Arquivos)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: br.com.fitpersonal.treino
            UTTypeDescription: Treino FitPersonal
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rjetreino]
          - UTTypeIdentifier: br.com.fitpersonal.treinopack
            UTTypeDescription: Treino FitPersonal com vídeos
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [rjetreinopack]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Treino FitPersonal
            LSHandlerRank: Owner
            LSItemContentTypes:
              - br.com.fitpersonal.treino
              - br.com.fitpersonal.treinopack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.fitpersonal.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
  FitPersonalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../docs/contrato/exemplos
        type: folder
        buildPhase: resources
    dependencies:
      - target: FitPersonal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
